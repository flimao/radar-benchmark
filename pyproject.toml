[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "radar-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3,<4", "dash>=3,<5", "plotly>=6", "duckdb>=1.2", "pandas>=2.2", "pyarrow>=19", "httpx>=0.28", "openpyxl>=3.1", "PyMuPDF>=1.25", "gunicorn>=23"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.setuptools.package-data]
"radar.web" = ["assets/*.css"]
